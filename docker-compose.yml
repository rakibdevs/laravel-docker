services:

  nginx:
    image: nginx:1.27-alpine
    container_name: laravel_nginx
    restart: unless-stopped
    tty: true
    ports:
      - "8999:80"
    volumes:
      - ./src:/app
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - laravel

  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: laravel_php
    restart: unless-stopped
    volumes:
      - ./src:/app
      - ./docker/php/www.conf:/usr/local/etc/php-fpm.d/www.conf:rw
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:rw
    user: "1000:0"
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "3"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    working_dir: /app
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - laravel

  mysql:
    image: mysql:8.4
    container_name: laravel_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-1234}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-1234}
    ports:
      - "3399:${DB_PORT:-3306}"
    volumes:
      - ./docker/database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-1234}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - laravel

  node:
    build:
      context: ./docker/node
      dockerfile: Dockerfile
    container_name: laravel_node
    restart: unless-stopped
    volumes:
      - ./src:/app
    working_dir: /app
    # Keeps the container alive for running npm commands interactively
    # Override with: docker compose run --rm node npm run dev
    command: sh -c "npm install && npm run build"
    networks:
      - laravel

  redis:
    image: redis:7.4-alpine
    container_name: laravel_redis
    restart: unless-stopped
    ports:
      - "6399:6379"
    networks:
      - laravel

networks:
  laravel:
    driver: bridge